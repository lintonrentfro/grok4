<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Battles - v6</title>
    <style>
        body {
            background-color: lightgrey;
            margin: 0;
            padding: 0;
        }
        #game-area {
            width: 1000px;
            height: 700px;
            background-color: white;
            border: 3px solid black;
            margin: 40px auto 0 auto;
        }
        #button-row {
            width: 100%;
            height: 60px;
            border-bottom: 3px solid black;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            border: 2px solid black;
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        #modal form {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        #modal label {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="game-area">
        <div id="button-row">
            <button id="char-creator">Character Creator</button>
            <button>Fight!</button>
        </div>
    </div>
    <div id="modal">
        <form>
            <label for="name">Name: <input type="text" id="name"></label>
            <label for="job">Job: 
                <select id="job">
                    <option>Janitor</option>
                    <option>Accountant</option>
                    <option>Engineer</option>
                </select>
            </label>
            <label for="strength">Strength: <input type="number" id="strength" value="10"></label>
            <button type="button">Enter Area</button>
        </form>
    </div>
    <script>
        document.getElementById('char-creator').addEventListener('click', function() {
            document.getElementById('modal').style.display = 'block';
        });
    </script>
</body>
</html>
