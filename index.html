<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Battles - v40</title>
    <style>
        body {
            background-color: lightgrey;
            margin: 0;
            padding: 0;
        }
        #game-area {
            width: 1000px;
            height: 700px;
            background-color: white;
            border: 3px solid black;
            margin: 40px auto 0 auto;
            position: relative;
        }
        #button-row {
            width: 100%;
            height: 60px;
            border-bottom: 3px solid black;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            border: 2px solid black;
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        #modal form {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        #modal label {
            margin-bottom: 10px;
        }
        #remaining-points {
            border: none;
        }
        .character {
            position: absolute;
            width: 75px;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .character img {
            width: 75px;
            height: 75px;
            border: 2px solid white;
            box-sizing: border-box;
        }
        .character .name {
            width: 75px;
            text-align: center;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 20px;
        }
        .cubicle {
            position: absolute;
        }
        .cubicle img {
            width: 75px;
            height: 75px;
        }
        .message {
            position: absolute;
            color: red;
            font-size: 14px;
            text-align: center;
            width: 75px;
            transition: opacity 0.5s;
        }
        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="game-area">
        <div id="button-row">
            <button id="char-creator">Character Creator</button>
            <button id="test">Test</button>
            <button id="fight">Fight!</button>
        </div>
    </div>
    <div id="modal">
        <form>
            <label for="name">Name: <input type="text" id="name"></label>
            <label for="remaining-points">Remaining Points: <input type="number" id="remaining-points" value="0" readonly></label>
            <label for="attack">Attack: <input type="number" id="attack" value="15" min="0" step="1"></label>
            <label for="defend">Defend: <input type="number" id="defend" value="15" min="0" step="1"></label>
            <button type="button" id="enter-arena">Enter Arena</button>
        </form>
    </div>
    <script>
        document.getElementById('char-creator').addEventListener('click', function() {
            document.getElementById('name').value = '';
            document.getElementById('attack').value = 15;
            document.getElementById('defend').value = 15;
            updateRemaining();
            document.getElementById('modal').style.display = 'block';
        });

        const stats = ['attack', 'defend'];
        function updateRemaining() {
            let sum = 0;
            stats.forEach(stat => {
                const value = parseInt(document.getElementById(stat).value) || 0;
                sum += value;
            });
            const remaining = 30 - sum;
            document.getElementById('remaining-points').value = remaining;
            const enterBtn = document.getElementById('enter-arena');
            enterBtn.disabled = remaining < 0;
        }

        function handleStatInput(event) {
            const input = event.target;
            let newValue = parseInt(input.value) || 0;
            let otherSum = 0;
            stats.forEach(stat => {
                if (stat !== input.id) {
                    otherSum += parseInt(document.getElementById(stat).value) || 0;
                }
            });
            const max = 30 - otherSum;
            const clamped = Math.max(0, Math.min(newValue, max));
            if (clamped !== newValue) {
                input.value = clamped;
            }
            updateRemaining();
        }

        stats.forEach(stat => {
            document.getElementById(stat).addEventListener('input', handleStatInput);
        });
        updateRemaining(); // Initial call

        function getRandomBorderPosition() {
            let left, top;
            const width = 75;
            const height = 75;
            const arenaWidth = 1000;
            const arenaHeight = 700;
            const buttonHeight = 60;
            const minDist = 50;
            const maxDist = 100;

            do {
                left = Math.random() * (arenaWidth - width);
                top = buttonHeight + Math.random() * (arenaHeight - buttonHeight - height);
                const distLeft = left;
                const distRight = arenaWidth - left - width;
                const distTop = top - buttonHeight;
                const distBottom = arenaHeight - top - height;
                const minEdgeDist = Math.min(distLeft, distRight, distTop, distBottom);
                if (minEdgeDist >= minDist && minEdgeDist <= maxDist) {
                    return {left, top};
                }
            } while (true);
        }

        document.getElementById('enter-arena').addEventListener('click', function() {
            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert("Please fill in the Name field.");
                return;
            }
            const attack = parseInt(document.getElementById('attack').value) || 0;
            const defend = parseInt(document.getElementById('defend').value) || 0;

            const character = {
                name: name,
                attack: attack,
                defend: defend
            };

            const charVarName = 'Character_' + name;
            window[charVarName] = character;
            console.log(JSON.stringify(character));

            const charDiv = document.createElement('div');
            charDiv.className = 'character';
            const img = document.createElement('img');
            img.src = 'https://lintonrentfro.github.io/grok4/images/space_marine.png';
            charDiv.appendChild(img);
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = name;
            charDiv.appendChild(nameSpan);
            const pos = getRandomBorderPosition();
            charDiv.style.left = `${pos.left}px`;
            charDiv.style.top = `${pos.top}px`;
            document.getElementById('game-area').appendChild(charDiv);
            character.element = charDiv;

            // Adjust font size to fit
            let fontSize = 20;
            nameSpan.style.fontSize = `${fontSize}px`;
            while (nameSpan.scrollWidth > 75 && fontSize > 1) {
                fontSize--;
                nameSpan.style.fontSize = `${fontSize}px`;
            }

            // Check for overlap with existing characters
            let characters = [];
            for (let key in window) {
                if (key.startsWith('Character_')) {
                    let char = window[key];
                    if (char.element && char.element.parentNode) {
                        characters.push(char);
                    }
                }
            }
            let overlap = true;
            while (overlap) {
                overlap = false;
                characters.forEach(other => {
                    if (other !== character && other.hp !== 0) { // hp not set yet
                        let o_left = parseFloat(other.element.style.left);
                        let o_top = parseFloat(other.element.style.top);
                        let p_left = parseFloat(charDiv.style.left);
                        let p_top = parseFloat(charDiv.style.top);
                        if (!(p_left + 75 <= o_left || o_left + 75 <= p_left || p_top + 75 <= o_top || o_top + 75 <= p_top)) {
                            overlap = true;
                            const newPos = getRandomBorderPosition();
                            charDiv.style.left = `${newPos.left}px`;
                            charDiv.style.top = `${newPos.top}px`;
                        }
                    }
                });
            }

            document.getElementById('modal').style.display = 'none';
        });

        function generateRandomStats() {
            const attack = Math.floor(Math.random() * 31);
            const defend = 30 - attack;
            return [attack, defend];
        }

        function Test() {
            // Remove all existing characters
            document.querySelectorAll('.character').forEach(el => el.remove());
            for (let key in window) {
                if (key.startsWith('Character_')) {
                    delete window[key];
                }
            }

            const names = ["Rocko", "Jocko", "Mugsy", "Larry"];
            let characters = [];
            names.forEach(name => {
                const [attack, defend] = generateRandomStats();

                const character = {
                    name: name,
                    attack: attack,
                    defend: defend
                };

                const charVarName = 'Character_' + name;
                window[charVarName] = character;
                console.log(JSON.stringify(character));

                const charDiv = document.createElement('div');
                charDiv.className = 'character';
                const img = document.createElement('img');
                img.src = 'https://lintonrentfro.github.io/grok4/images/space_marine.png';
                charDiv.appendChild(img);
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = name;
                charDiv.appendChild(nameSpan);
                let placed = false;
                while (!placed) {
                    const pos = getRandomBorderPosition();
                    charDiv.style.left = `${pos.left}px`;
                    charDiv.style.top = `${pos.top}px`;
                    let overlap = false;
                    characters.forEach(other => {
                        let o_left = parseFloat(other.element.style.left);
                        let o_top = parseFloat(other.element.style.top);
                        if (!(pos.left + 75 <= o_left || o_left + 75 <= pos.left || pos.top + 75 <= o_top || o_top + 75 <= pos.top)) {
                            overlap = true;
                        }
                    });
                    if (!overlap) {
                        document.getElementById('game-area').appendChild(charDiv);
                        character.element = charDiv;
                        characters.push(character);
                        placed = true;
                    }
                }

                // Adjust font size to fit
                let fontSize = 20;
                nameSpan.style.fontSize = `${fontSize}px`;
                while (nameSpan.scrollWidth > 75 && fontSize > 1) {
                    fontSize--;
                    nameSpan.style.fontSize = `${fontSize}px`;
                }
            });
        }

        document.getElementById('test').addEventListener('click', Test);

        function shuffle(array) {
            let currentIndex = array.length;
            while (currentIndex != 0) {
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showMessage(char, text) {
            if (char.messageElement) {
                char.messageElement.classList.add('fade-out');
                setTimeout(() => {
                    if (char.messageElement) {
                        char.messageElement.remove();
                        delete char.messageElement;
                    }
                }, 500);
            }

            const msg = document.createElement('div');
            msg.className = 'message';
            msg.textContent = text;
            msg.style.left = char.element.style.left;
            msg.style.top = `${parseFloat(char.element.style.top) - 20}px`;
            document.getElementById('game-area').appendChild(msg);
            char.messageElement = msg;
        }

        function Battle() {
            document.querySelectorAll('.cubicle').forEach(el => el.remove());
            let characters = [];
            for (let key in window) {
                if (key.startsWith('Character_')) {
                    let char = window[key];
                    if (char.element && char.element.parentNode) { // still in arena
                        characters.push(char);
                    }
                }
            }

            if (characters.length < 2) {
                alert("Need at least two characters to battle!");
                return;
            }

            // Initialize HP
            characters.forEach(char => {
                char.hp = 3;
            });

            // Create log div
            let logDiv = document.createElement('div');
            logDiv.style.position = 'absolute';
            logDiv.style.bottom = '0';
            logDiv.style.left = '0';
            logDiv.style.height = '100px';
            logDiv.style.width = '100%';
            logDiv.style.overflowY = 'auto';
            logDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
            logDiv.style.borderTop = '1px solid black';
            logDiv.style.padding = '5px';
            logDiv.style.boxSizing = 'border-box';
            logDiv.style.fontSize = '12px';
            document.getElementById('game-area').appendChild(logDiv);

            function logMessage(msg) {
                let p = document.createElement('p');
                p.textContent = msg;
                p.style.margin = '2px 0';
                logDiv.appendChild(p);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            logMessage("Battle begins!");

            const cubicleUrls = [
                'https://lintonrentfro.github.io/grok4/images/cubicles_1.png',
                'https://lintonrentfro.github.io/grok4/images/cubicles_2.png',
                'https://lintonrentfro.github.io/grok4/images/cubicles_3.png'
            ];
            const cubicles = [];
            cubicleUrls.forEach(url => {
                const cubDiv = document.createElement('div');
                cubDiv.className = 'cubicle';
                const img = document.createElement('img');
                img.src = url;
                cubDiv.appendChild(img);
                let placed = false;
                while (!placed) {
                    let proposed_left = 200 + Math.random() * (725 - 200);
                    let proposed_top = 260 + Math.random() * (425 - 260);
                    let wouldOverlap = false;
                    // Check overlap with characters
                    characters.forEach(char => {
                        let c_left = parseFloat(char.element.style.left);
                        let c_top = parseFloat(char.element.style.top);
                        if (!(proposed_left + 75 <= c_left || c_left + 75 <= proposed_left || proposed_top + 75 <= c_top || c_top + 75 <= proposed_top)) {
                            wouldOverlap = true;
                        }
                    });
                    // Check overlap with other cubicles
                    cubicles.forEach(cub => {
                        let o_left = parseFloat(cub.element.style.left);
                        let o_top = parseFloat(cub.element.style.top);
                        if (!(proposed_left + 75 <= o_left || o_left + 75 <= proposed_left || proposed_top + 75 <= o_top || o_top + 75 <= proposed_top)) {
                            wouldOverlap = true;
                        }
                    });
                    if (!wouldOverlap) {
                        cubDiv.style.left = `${proposed_left}px`;
                        cubDiv.style.top = `${proposed_top}px`;
                        document.getElementById('game-area').appendChild(cubDiv);
                        cubicles.push({element: cubDiv});
                        placed = true;
                    }
                }
            });

            // No need for additional overlap check since placed without overlap

            const cos45 = Math.cos(Math.PI / 4);
            const sin45 = Math.sin(Math.PI / 4);

            const interval = setInterval(() => {
                characters.forEach(char => {
                    if (char.messageElement) {
                        char.messageElement.remove();
                        delete char.messageElement;
                    }
                });

                // Shuffle for movement
                let movedCharacters = shuffle([...characters]);

                // Move characters
                movedCharacters.forEach(char => {
                    if (char.hp > 0) {
                        // Find nearest alive opponent
                        let nearest = null;
                        let minDist = Infinity;
                        characters.forEach(other => {
                            if (other !== char && other.hp > 0) {
                                let ax = parseFloat(char.element.style.left) + 37.5;
                                let ay = parseFloat(char.element.style.top) + 37.5;
                                let ox = parseFloat(other.element.style.left) + 37.5;
                                let oy = parseFloat(other.element.style.top) + 37.5;
                                let dist = Math.sqrt((ax - ox) ** 2 + (ay - oy) ** 2);
                                if (dist < minDist) {
                                    minDist = dist;
                                    nearest = other;
                                }
                            }
                        });

                        if (nearest) {
                            let left = parseFloat(char.element.style.left);
                            let top = parseFloat(char.element.style.top);
                            let proposed_left = left;
                            let proposed_top = top;

                            let tx = parseFloat(nearest.element.style.left);
                            let ty = parseFloat(nearest.element.style.top);
                            let deltaX = tx - left;
                            let deltaY = ty - top;
                            let dist = Math.sqrt(deltaX ** 2 + deltaY ** 2);
                            let moveX, moveY;
                            if (dist > 0) {
                                let step = Math.random() * 20 + 10;
                                moveX = (deltaX / dist) * step;
                                moveY = (deltaY / dist) * step;
                            } else {
                                moveX = 0;
                                moveY = 0;
                            }

                            if (minDist <= 10) {
                                moveX = Math.random() * 40 - 20;
                                moveY = Math.random() * 40 - 20;
                            }

                            proposed_left += moveX;
                            proposed_top += moveY;

                            proposed_left = Math.max(0, Math.min(1000 - 75, proposed_left));
                            proposed_top = Math.max(60, Math.min(700 - 60 - 75, proposed_top));

                            // Check if proposed position overlaps with any other character's current position or cubicles
                            let wouldOverlap = false;
                            characters.forEach(other => {
                                if (other !== char && other.hp > 0) {
                                    let o_left = parseFloat(other.element.style.left);
                                    let o_top = parseFloat(other.element.style.top);
                                    let p_right = proposed_left + 75;
                                    let p_bottom = proposed_top + 75;
                                    let o_right = o_left + 75;
                                    let o_bottom = o_top + 75;
                                    if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                        wouldOverlap = true;
                                    }
                                }
                            });
                            cubicles.forEach(cub => {
                                let o_left = parseFloat(cub.element.style.left);
                                let o_top = parseFloat(cub.element.style.top);
                                let p_right = proposed_left + 75;
                                let p_bottom = proposed_top + 75;
                                let o_right = o_left + 75;
                                let o_bottom = o_top + 75;
                                if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                    wouldOverlap = true;
                                }
                            });

                            if (wouldOverlap) {
                                // Try left rotation
                                let moveX_left = moveX * cos45 - moveY * sin45;
                                let moveY_left = moveX * sin45 + moveY * cos45;
                                let proposed_left_left = left + moveX_left;
                                let proposed_top_left = top + moveY_left;
                                proposed_left_left = Math.max(0, Math.min(1000 - 75, proposed_left_left));
                                proposed_top_left = Math.max(60, Math.min(700 - 60 - 75, proposed_top_left));

                                let wouldOverlap_left = false;
                                characters.forEach(other => {
                                    if (other !== char && other.hp > 0) {
                                        let o_left = parseFloat(other.element.style.left);
                                        let o_top = parseFloat(other.element.style.top);
                                        let p_right = proposed_left_left + 75;
                                        let p_bottom = proposed_top_left + 75;
                                        let o_right = o_left + 75;
                                        let o_bottom = o_top + 75;
                                        if (!(p_right <= o_left || o_right <= proposed_left_left || p_bottom <= o_top || o_bottom <= proposed_top_left)) {
                                            wouldOverlap_left = true;
                                        }
                                    }
                                });
                                cubicles.forEach(cub => {
                                    let o_left = parseFloat(cub.element.style.left);
                                    let o_top = parseFloat(cub.element.style.top);
                                    let p_right = proposed_left_left + 75;
                                    let p_bottom = proposed_top_left + 75;
                                    let o_right = o_left + 75;
                                    let o_bottom = o_top + 75;
                                    if (!(p_right <= o_left || o_right <= proposed_left_left || p_bottom <= o_top || o_bottom <= proposed_top_left)) {
                                        wouldOverlap_left = true;
                                    }
                                });

                                if (!wouldOverlap_left) {
                                    proposed_left = proposed_left_left;
                                    proposed_top = proposed_top_left;
                                    wouldOverlap = false;
                                } else {
                                    // Try right rotation
                                    let moveX_right = moveX * cos45 + moveY * sin45;
                                    let moveY_right = -moveX * sin45 + moveY * cos45;
                                    let proposed_left_right = left + moveX_right;
                                    let proposed_top_right = top + moveY_right;
                                    proposed_left_right = Math.max(0, Math.min(1000 - 75, proposed_left_right));
                                    proposed_top_right = Math.max(60, Math.min(700 - 60 - 75, proposed_top_right));

                                    let wouldOverlap_right = false;
                                    characters.forEach(other => {
                                        if (other !== char && other.hp > 0) {
                                            let o_left = parseFloat(other.element.style.left);
                                            let o_top = parseFloat(other.element.style.top);
                                            let p_right = proposed_left_right + 75;
                                            let p_bottom = proposed_top_right + 75;
                                            let o_right = o_left + 75;
                                            let o_bottom = o_top + 75;
                                            if (!(p_right <= o_left || o_right <= proposed_left_right || p_bottom <= o_top || o_bottom <= proposed_top_right)) {
                                                wouldOverlap_right = true;
                                            }
                                        }
                                    });
                                    cubicles.forEach(cub => {
                                        let o_left = parseFloat(cub.element.style.left);
                                        let o_top = parseFloat(cub.element.style.top);
                                        let p_right = proposed_left_right + 75;
                                        let p_bottom = proposed_top_right + 75;
                                        let o_right = o_left + 75;
                                        let o_bottom = o_top + 75;
                                        if (!(p_right <= o_left || o_right <= proposed_left_right || p_bottom <= o_top || o_bottom <= proposed_top_right)) {
                                            wouldOverlap_right = true;
                                        }
                                    });

                                    if (!wouldOverlap_right) {
                                        proposed_left = proposed_left_right;
                                        proposed_top = proposed_top_right;
                                        wouldOverlap = false;
                                    }
                                }
                            }

                            if (!wouldOverlap) {
                                // Apply close range adjustment if applicable
                                let px = proposed_left + 37.5;
                                let py = proposed_top + 37.5;
                                let nx = parseFloat(nearest.element.style.left) + 37.5;
                                let ny = parseFloat(nearest.element.style.top) + 37.5;
                                let proposed_dist = Math.sqrt((px - nx) ** 2 + (py - ny) ** 2);

                                if (minDist <= 10) {
                                    if (proposed_dist < 5) {
                                        // Push away
                                        let dirX = px - nx;
                                        let dirY = py - ny;
                                        let dir_dist = Math.sqrt(dirX ** 2 + dirY ** 2);
                                        if (dir_dist > 0) {
                                            let adjust = 5 - proposed_dist;
                                            let adjustX = (dirX / dir_dist) * adjust;
                                            let adjustY = (dirY / dir_dist) * adjust;
                                            proposed_left += adjustX;
                                            proposed_top += adjustY;
                                        }
                                    } else if (proposed_dist > 20) {
                                        // Pull closer
                                        let dirX = nx - px;
                                        let dirY = ny - py;
                                        let dir_dist = Math.sqrt(dirX ** 2 + dirY ** 2);
                                        if (dir_dist > 0) {
                                            let adjust = proposed_dist - 20;
                                            let adjustX = (dirX / dir_dist) * adjust;
                                            let adjustY = (dirY / dir_dist) * adjust;
                                            proposed_left += adjustX;
                                            proposed_top += adjustY;
                                        }
                                    }
                                }

                                proposed_left = Math.max(0, Math.min(1000 - 75, proposed_left));
                                proposed_top = Math.max(60, Math.min(700 - 60 - 75, proposed_top));

                                // Final check after adjustment
                                let finalOverlap = false;
                                characters.forEach(other => {
                                    if (other !== char && other.hp > 0) {
                                        let o_left = parseFloat(other.element.style.left);
                                        let o_top = parseFloat(other.element.style.top);
                                        let p_right = proposed_left + 75;
                                        let p_bottom = proposed_top + 75;
                                        let o_right = o_left + 75;
                                        let o_bottom = o_top + 75;
                                        if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                            finalOverlap = true;
                                        }
                                    }
                                });
                                cubicles.forEach(cub => {
                                    let o_left = parseFloat(cub.element.style.left);
                                    let o_top = parseFloat(cub.element.style.top);
                                    let p_right = proposed_left + 75;
                                    let p_bottom = proposed_top + 75;
                                    let o_right = o_left + 75;
                                    let o_bottom = o_top + 75;
                                    if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                        finalOverlap = true;
                                    }
                                });

                                if (!finalOverlap) {
                                    char.element.style.left = `${proposed_left}px`;
                                    char.element.style.top = `${proposed_top}px`;
                                }
                            }
                            // If overlap, do nothing (no move)
                        }
                    }
                });

                // Shuffle for attacks
                let attackCharacters = shuffle([...characters]);

                // Check for attacks
                attackCharacters.forEach(attacker => {
                    if (attacker.hp <= 0) return;

                    // Shuffle potential defenders for this attacker
                    let potentialDefenders = shuffle([...characters]);

                    let attacked = false;
                    for (let defender of potentialDefenders) {
                        if (attacker === defender || defender.hp <= 0) continue;

                        let ax = parseFloat(attacker.element.style.left) + 37.5;
                        let ay = parseFloat(attacker.element.style.top) + 37.5;
                        let dx = parseFloat(defender.element.style.left) + 37.5;
                        let dy = parseFloat(defender.element.style.top) + 37.5;
                        let cx_diff = Math.abs(ax - dx);
                        let cy_diff = Math.abs(ay - dy);
                        let dx_edge = Math.max(0, cx_diff - 75);
                        let dy_edge = Math.max(0, cy_diff - 75);
                        let edge_dist = Math.sqrt(dx_edge * dx_edge + dy_edge * dy_edge);

                        if (edge_dist <= 10) {
                            // Calculate hit chance
                            let hitChance = 0.05 * attacker.attack - 0.05 * defender.defend;
                            hitChance = Math.max(0.1, Math.min(0.9, hitChance));
                            let hitRoll = Math.random();

                            if (hitRoll < hitChance) {
                                let damage = 1;

                                defender.hp -= damage;
                                defender.hp = Math.max(0, defender.hp);

                                showMessage(attacker, "Hit!");
                                showMessage(defender, "-1 hp");

                                logMessage(`${attacker.name} attacks ${defender.name} for ${damage} damage. ${defender.name} HP: ${defender.hp} (hitRoll: ${hitRoll.toFixed(2)} < hitChance: 0.05*${attacker.attack} - 0.05*${defender.defend} = ${hitChance.toFixed(2)})`);

                                if (defender.hp <= 0) {
                                    logMessage(`${defender.name} is defeated!`);
                                    if (defender.messageElement) {
                                        defender.messageElement.remove();
                                    }
                                    defender.element.remove();
                                }
                            } else {
                                showMessage(attacker, "Missed!");
                                logMessage(`${attacker.name} misses ${defender.name} (hitRoll: ${hitRoll.toFixed(2)} >= hitChance: 0.05*${attacker.attack} - 0.05*${defender.defend} = ${hitChance.toFixed(2)})`);
                            }

                            attacked = true;
                            // Only one attack per turn per attacker
                            break;
                        }
                    }

                    if (!attacked) {
                        logMessage(`${attacker.name} has no target in range.`);
                    }
                });

                // Check for winner
                let alive = characters.filter(c => c.hp > 0);
                if (alive.length <= 1) {
                    clearInterval(interval);
                    if (alive.length === 1) {
                        logMessage(`${alive[0].name} is the winner!`);
                        showMessage(alive[0], "Winner!");
                    } else {
                        logMessage("It's a draw!");
                    }
                    // Remove log after some time or keep
                }
            }, 400); // Attacks and moves every 0.4 seconds for moderate speed
        }

        document.getElementById('fight').addEventListener('click', Battle);
    </script>
