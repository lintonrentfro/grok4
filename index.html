<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Battles - v27</title>
    <style>
        body {
            background-color: lightgrey;
            margin: 0;
            padding: 0;
        }
        #game-area {
            width: 1000px;
            height: 700px;
            background-color: white;
            border: 3px solid black;
            margin: 40px auto 0 auto;
            position: relative;
        }
        #button-row {
            width: 100%;
            height: 60px;
            border-bottom: 3px solid black;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
        }
        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 400px;
            border: 2px solid black;
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
        }
        #modal form {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        #modal label {
            margin-bottom: 10px;
        }
        #remaining-points {
            border: none;
        }
        .character {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            border: 2px solid black;
            box-sizing: border-box;
            overflow: hidden;
            font-size: 20px;
        }
        .character span {
            width: 45px;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="game-area">
        <div id="button-row">
            <button id="char-creator">Character Creator</button>
            <button id="test">Test</button>
            <button id="fight">Fight!</button>
        </div>
    </div>
    <div id="modal">
        <form>
            <label for="name">Name: <input type="text" id="name"></label>
            <label for="remaining-points">Remaining Points: <input type="number" id="remaining-points" value="0" readonly></label>
            <label for="strength">Strength: <input type="number" id="strength" value="10" min="0" step="1"></label>
            <label for="dexterity">Dexterity: <input type="number" id="dexterity" value="10" min="0" step="1"></label>
            <label for="luck">Luck: <input type="number" id="luck" value="10" min="0" step="1"></label>
            <label for="magic">Magic: <input type="number" id="magic" value="10" min="0" step="1"></label>
            <label for="weapons">Weapons: <input type="number" id="weapons" value="10" min="0" step="1"></label>
            <button type="button" id="enter-arena">Enter Arena</button>
        </form>
    </div>
    <script>
        document.getElementById('char-creator').addEventListener('click', function() {
            document.getElementById('name').value = '';
            document.getElementById('strength').value = 10;
            document.getElementById('dexterity').value = 10;
            document.getElementById('luck').value = 10;
            document.getElementById('magic').value = 10;
            document.getElementById('weapons').value = 10;
            updateRemaining();
            document.getElementById('modal').style.display = 'block';
        });

        const stats = ['strength', 'dexterity', 'luck', 'magic', 'weapons'];
        function updateRemaining() {
            let sum = 0;
            stats.forEach(stat => {
                const value = parseInt(document.getElementById(stat).value) || 0;
                sum += value;
            });
            const remaining = 50 - sum;
            document.getElementById('remaining-points').value = remaining;
            const enterBtn = document.getElementById('enter-arena');
            enterBtn.disabled = remaining < 0;
        }

        function handleStatInput(event) {
            const input = event.target;
            let newValue = parseInt(input.value) || 0;
            let otherSum = 0;
            stats.forEach(stat => {
                if (stat !== input.id) {
                    otherSum += parseInt(document.getElementById(stat).value) || 0;
                }
            });
            const max = 50 - otherSum;
            const clamped = Math.max(0, Math.min(newValue, max));
            if (clamped !== newValue) {
                input.value = clamped;
            }
            updateRemaining();
        }

        stats.forEach(stat => {
            document.getElementById(stat).addEventListener('input', handleStatInput);
        });
        updateRemaining(); // Initial call

        document.getElementById('enter-arena').addEventListener('click', function() {
            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert("Please fill in the Name field.");
                return;
            }
            const strength = parseInt(document.getElementById('strength').value) || 0;
            const dexterity = parseInt(document.getElementById('dexterity').value) || 0;
            const luck = parseInt(document.getElementById('luck').value) || 0;
            const magic = parseInt(document.getElementById('magic').value) || 0;
            const weapons = parseInt(document.getElementById('weapons').value) || 0;

            const character = {
                name: name,
                strength: strength,
                dexterity: dexterity,
                luck: luck,
                magic: magic,
                weapons: weapons
            };

            const charVarName = 'Character_' + name;
            window[charVarName] = character;
            console.log(JSON.stringify(character));

            const charDiv = document.createElement('div');
            charDiv.className = 'character';
            const span = document.createElement('span');
            span.textContent = name;
            charDiv.appendChild(span);
            charDiv.style.left = `${Math.random() * (1000 - 50)}px`;
            charDiv.style.top = `${60 + Math.random() * (700 - 60 - 50)}px`;
            document.getElementById('game-area').appendChild(charDiv);
            character.element = charDiv;

            // Adjust font size to fit
            let fontSize = 20;
            span.style.fontSize = `${fontSize}px`;
            while (span.scrollWidth > 45 && fontSize > 1) {
                fontSize--;
                span.style.fontSize = `${fontSize}px`;
            }

            document.getElementById('modal').style.display = 'none';
        });

        function generateRandomStats() {
            let points = 50;
            let statValues = [];
            for (let i = 0; i < 4; i++) {
                let val = Math.floor(Math.random() * (points + 1));
                statValues.push(val);
                points -= val;
            }
            statValues.push(points);
            return statValues;
        }

        function Test() {
            const names = ["Picard", "Data", "Worf", "Riker"];
            names.forEach(name => {
                const [strength, dexterity, luck, magic, weapons] = generateRandomStats();

                const character = {
                    name: name,
                    strength: strength,
                    dexterity: dexterity,
                    luck: luck,
                    magic: magic,
                    weapons: weapons
                };

                const charVarName = 'Character_' + name;
                window[charVarName] = character;
                console.log(JSON.stringify(character));

                const charDiv = document.createElement('div');
                charDiv.className = 'character';
                const span = document.createElement('span');
                span.textContent = name;
                charDiv.appendChild(span);
                charDiv.style.left = `${Math.random() * (1000 - 50)}px`;
                charDiv.style.top = `${60 + Math.random() * (700 - 60 - 50)}px`;
                document.getElementById('game-area').appendChild(charDiv);
                character.element = charDiv;

                // Adjust font size to fit
                let fontSize = 20;
                span.style.fontSize = `${fontSize}px`;
                while (span.scrollWidth > 45 && fontSize > 1) {
                    fontSize--;
                    span.style.fontSize = `${fontSize}px`;
                }
            });
        }

        document.getElementById('test').addEventListener('click', Test);

        function shuffle(array) {
            let currentIndex = array.length;
            while (currentIndex != 0) {
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function Battle() {
            let characters = [];
            for (let key in window) {
                if (key.startsWith('Character_')) {
                    let char = window[key];
                    if (char.element && char.element.parentNode) { // still in arena
                        characters.push(char);
                    }
                }
            }

            if (characters.length < 2) {
                alert("Need at least two characters to battle!");
                return;
            }

            // Initialize HP
            characters.forEach(char => {
                char.hp = 50 + (char.strength * 3) + (char.dexterity * 2);
            });

            // Create log div
            let logDiv = document.createElement('div');
            logDiv.style.position = 'absolute';
            logDiv.style.bottom = '0';
            logDiv.style.left = '0';
            logDiv.style.height = '100px';
            logDiv.style.width = '100%';
            logDiv.style.overflowY = 'auto';
            logDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.8)';
            logDiv.style.borderTop = '1px solid black';
            logDiv.style.padding = '5px';
            logDiv.style.boxSizing = 'border-box';
            logDiv.style.fontSize = '12px';
            document.getElementById('game-area').appendChild(logDiv);

            function logMessage(msg) {
                let p = document.createElement('p');
                p.textContent = msg;
                p.style.margin = '2px 0';
                logDiv.appendChild(p);
                logDiv.scrollTop = logDiv.scrollHeight;
            }

            logMessage("Battle begins!");

            const interval = setInterval(() => {
                // Shuffle for movement
                let movedCharacters = shuffle([...characters]);

                // Move characters
                movedCharacters.forEach(char => {
                    if (char.hp > 0) {
                        // Find nearest alive opponent
                        let nearest = null;
                        let minDist = Infinity;
                        characters.forEach(other => {
                            if (other !== char && other.hp > 0) {
                                let ax = parseFloat(char.element.style.left) + 25;
                                let ay = parseFloat(char.element.style.top) + 25;
                                let ox = parseFloat(other.element.style.left) + 25;
                                let oy = parseFloat(other.element.style.top) + 25;
                                let dist = Math.sqrt((ax - ox) ** 2 + (ay - oy) ** 2);
                                if (dist < minDist) {
                                    minDist = dist;
                                    nearest = other;
                                }
                            }
                        });

                        if (nearest) {
                            let left = parseFloat(char.element.style.left);
                            let top = parseFloat(char.element.style.top);
                            let proposed_left = left;
                            let proposed_top = top;

                            if (minDist > 10) {
                                // Move towards
                                let tx = parseFloat(nearest.element.style.left);
                                let ty = parseFloat(nearest.element.style.top);
                                let deltaX = tx - left;
                                let deltaY = ty - top;
                                let dist = Math.sqrt(deltaX ** 2 + deltaY ** 2);
                                if (dist > 0) {
                                    let step = Math.random() * 10 + 5;
                                    let moveX = (deltaX / dist) * step;
                                    let moveY = (deltaY / dist) * step;
                                    proposed_left += moveX;
                                    proposed_top += moveY;
                                }
                            } else {
                                // Move randomly
                                let moveX = Math.random() * 20 - 10;
                                let moveY = Math.random() * 20 - 10;
                                proposed_left += moveX;
                                proposed_top += moveY;
                            }

                            proposed_left = Math.max(0, Math.min(950, proposed_left));
                            proposed_top = Math.max(60, Math.min(650, proposed_top));

                            // Check if proposed position overlaps with any other character's current position
                            let wouldOverlap = false;
                            characters.forEach(other => {
                                if (other !== char && other.hp > 0) {
                                    let o_left = parseFloat(other.element.style.left);
                                    let o_top = parseFloat(other.element.style.top);
                                    let p_right = proposed_left + 50;
                                    let p_bottom = proposed_top + 50;
                                    let o_right = o_left + 50;
                                    let o_bottom = o_top + 50;
                                    if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                        wouldOverlap = true;
                                    }
                                }
                            });

                            if (!wouldOverlap) {
                                // Calculate proposed dist to nearest for close range adjustments
                                let px = proposed_left + 25;
                                let py = proposed_top + 25;
                                let nx = parseFloat(nearest.element.style.left) + 25;
                                let ny = parseFloat(nearest.element.style.top) + 25;
                                let proposed_dist = Math.sqrt((px - nx) ** 2 + (py - ny) ** 2);

                                if (minDist <= 10) {
                                    if (proposed_dist < 5) {
                                        // Push away
                                        let dirX = px - nx;
                                        let dirY = py - ny;
                                        let dir_dist = Math.sqrt(dirX ** 2 + dirY ** 2);
                                        if (dir_dist > 0) {
                                            let adjust = 5 - proposed_dist;
                                            let adjustX = (dirX / dir_dist) * adjust;
                                            let adjustY = (dirY / dir_dist) * adjust;
                                            proposed_left += adjustX;
                                            proposed_top += adjustY;
                                        }
                                    } else if (proposed_dist > 20) {
                                        // Pull closer
                                        let dirX = nx - px;
                                        let dirY = ny - py;
                                        let dir_dist = Math.sqrt(dirX ** 2 + dirY ** 2);
                                        if (dir_dist > 0) {
                                            let adjust = proposed_dist - 20;
                                            let adjustX = (dirX / dir_dist) * adjust;
                                            let adjustY = (dirY / dir_dist) * adjust;
                                            proposed_left += adjustX;
                                            proposed_top += adjustY;
                                        }
                                    }
                                }

                                proposed_left = Math.max(0, Math.min(950, proposed_left));
                                proposed_top = Math.max(60, Math.min(650, proposed_top));

                                // Apply the move only if no overlap after adjustments
                                let wouldOverlapAfterAdjust = false;
                                characters.forEach(other => {
                                    if (other !== char && other.hp > 0) {
                                        let o_left = parseFloat(other.element.style.left);
                                        let o_top = parseFloat(other.element.style.top);
                                        let p_right = proposed_left + 50;
                                        let p_bottom = proposed_top + 50;
                                        let o_right = o_left + 50;
                                        let o_bottom = o_top + 50;
                                        if (!(p_right <= o_left || o_right <= proposed_left || p_bottom <= o_top || o_bottom <= proposed_top)) {
                                            wouldOverlapAfterAdjust = true;
                                        }
                                    }
                                });

                                if (!wouldOverlapAfterAdjust) {
                                    char.element.style.left = `${proposed_left}px`;
                                    char.element.style.top = `${proposed_top}px`;
                                }
                            }
                            // If overlap, do nothing (no move)
                        }
                    }
                });

                // Shuffle for attacks
                let attackCharacters = shuffle([...characters]);

                // Check for attacks
                attackCharacters.forEach(attacker => {
                    if (attacker.hp <= 0) return;

                    // Shuffle potential defenders for this attacker
                    let potentialDefenders = shuffle([...characters]);

                    let attacked = false;
                    for (let defender of potentialDefenders) {
                        if (attacker === defender || defender.hp <= 0) continue;

                        let ax = parseFloat(attacker.element.style.left) + 25;
                        let ay = parseFloat(attacker.element.style.top) + 25;
                        let dx = parseFloat(defender.element.style.left) + 25;
                        let dy = parseFloat(defender.element.style.top) + 25;
                        let dist = Math.sqrt((ax - dx) ** 2 + (ay - dy) ** 2);

                        if (dist < 70) { // Increased range to 70
                            // Calculate hit chance
                            let dexDiff = attacker.dexterity - defender.dexterity;
                            let hitChanceDiff = dexDiff / 50;
                            let hitChance = Math.max(0.1, Math.min(0.9, 0.6 + hitChanceDiff));
                            let hitRoll = Math.random();

                            if (hitRoll < hitChance) {
                                let baseDamage = attacker.strength + (attacker.weapons * 0.5);
                                let magicRandom = Math.random();
                                let magicBonus = attacker.magic * magicRandom;
                                let damage = baseDamage + magicBonus;

                                let critChance = attacker.luck / 50;
                                let critRoll = Math.random();
                                let crit = false;
                                if (critRoll < critChance) {
                                    crit = true;
                                    damage *= 1.5;
                                    logMessage(`${attacker.name} crits! (critRoll: ${critRoll.toFixed(2)} < critChance: ${critChance.toFixed(2)}, multiplier: 1.5)`);
                                }

                                let luckReduceChance = defender.luck / 50;
                                let luckReduceRoll = Math.random();
                                let luckReduce = false;
                                if (luckReduceRoll < luckReduceChance) {
                                    luckReduce = true;
                                    damage *= 0.7;
                                    logMessage(`${defender.name} gets lucky and reduces damage! (luckReduceRoll: ${luckReduceRoll.toFixed(2)} < luckReduceChance: ${luckReduceChance.toFixed(2)}, multiplier: 0.7)`);
                                }

                                damage *= 1.5; // Increase overall damage by 50%
                                damage = Math.round(damage);
                                defender.hp -= damage;
                                defender.hp = Math.max(0, defender.hp);

                                logMessage(`${attacker.name} attacks ${defender.name} for ${damage} damage. ${defender.name} HP: ${defender.hp} (hitRoll: ${hitRoll.toFixed(2)} < hitChance: 0.6 + (${attacker.dexterity} - ${defender.dexterity}) / 50 = ${hitChance.toFixed(2)}, baseDamage: ${attacker.strength} + ${attacker.weapons} * 0.5 = ${baseDamage.toFixed(2)}, magicBonus: ${attacker.magic} * ${magicRandom.toFixed(2)} = ${magicBonus.toFixed(2)}, ${crit ? 'crit *1.5, ' : ''}${luckReduce ? 'luckReduce *0.7, ' : ''}overall *1.5, final rounded: ${damage})`);

                                if (defender.hp <= 0) {
                                    logMessage(`${defender.name} is defeated!`);
                                    defender.element.remove();
                                }
                            } else {
                                logMessage(`${attacker.name} misses ${defender.name} (hitRoll: ${hitRoll.toFixed(2)} >= hitChance: 0.6 + (${attacker.dexterity} - ${defender.dexterity}) / 50 = ${hitChance.toFixed(2)})`);
                            }

                            attacked = true;
                            // Only one attack per turn per attacker
                            break;
                        }
                    }

                    if (!attacked) {
                        logMessage(`${attacker.name} has no target in range.`);
                    }
                });

                // Check for winner
                let alive = characters.filter(c => c.hp > 0);
                if (alive.length <= 1) {
                    clearInterval(interval);
                    if (alive.length === 1) {
                        logMessage(`${alive[0].name} is the winner!`);
                        alert(`${alive[0].name} is the winner!`);
                    } else {
                        logMessage("It's a draw!");
                    }
                    // Remove log after some time or keep
                }
            }, 400); // Attacks and moves every 0.4 seconds for moderate speed
        }

        document.getElementById('fight').addEventListener('click', Battle);
    </script>
</body>
</html>
